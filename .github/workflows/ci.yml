name: Finova CI

on:
  push:
    branches: [main, "finova/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finova-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finova_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finova_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/finova_ci?schema=public"
      NEXTAUTH_SECRET: "ci-only-not-a-production-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
